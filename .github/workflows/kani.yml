name: Kani

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frame-verification:
    name: Bounded frame verification
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          command: cargo-kani
