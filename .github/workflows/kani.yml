name: Kani

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frame-verification:
    name: Bounded frame verification
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          command: cargo-kani
